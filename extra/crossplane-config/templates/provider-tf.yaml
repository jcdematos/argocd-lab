apiVersion: tf.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: tf-aws
spec:
  configuration: |
    terraform {
      backend "kubernetes" {
        secret_suffix     = "state"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }
    provider "aws" {
      shared_credentials_files = ["aws-creds.ini"]
      region = "us-east-1"
    }
  credentials:
    - filename: aws-creds.ini
      secretRef:
        key: creds
        name: aws-secret
        namespace: crossplane-system
      source: Secret
